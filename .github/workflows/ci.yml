name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (Rust 1.94 真构建)
    needs: fmt
    runs-on: ubuntu-latest
    # 裁定 D-22：README 与 Cargo.toml 声明 "Rust 1.94+"，本 job 让它不会随依赖升级悄悄漂移。
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal --no-self-update
          rustup default 1.94.0
          rustc --version

      - name: cargo build (locked, 以 MSRV)
        run: cargo build --workspace --locked

  test:
    name: test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p memstack-cli

      - name: Smoke CLI
        shell: bash
        run: |
          bin=target/release/memstack
          if [ -f target/release/memstack.exe ]; then bin=target/release/memstack.exe; fi
          "$bin" --help
          db=smoke.sqlite
          rm -f "$db"
          "$bin" --db "$db" add --deck smoke qa --front f --back b
          "$bin" --db "$db" decks
          "$bin" --db "$db" stats
